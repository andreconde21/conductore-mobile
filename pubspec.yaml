name: conduit
description: "A mobile terminal workspace for SSH, Mosh, SFTP, and local shells."
publish_to: 'none'
version: 0.1.0-conductore.10+48

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.1"

dependencies:
  flutter:
    sdk: flutter

  connectivity_plus: ^6.1.0
  cbor: ^6.3.7
  crypto: ^3.0.7
  # Vendored from gwitko/dartssh2_conduit@c39f316a with a small SFTP patch;
  # see third_party/dartssh2/README.md.
  dartssh2:
    path: third_party/dartssh2
  # Vendored from gwitko/conduit_vt@b486b894 with a renderer patch;
  # see third_party/conduit_vt/README.md.
  conduit_vt:
    path: third_party/conduit_vt
  dart_mosh: ^0.0.4
  flutter_pty: ^0.4.2
  ffi: ^2.2.0
  http: ^1.2.2
  path: ^1.9.0
  path_provider: ^2.1.4
  flutter_secure_storage: ^10.3.1
  local_auth: ^3.0.1
  pinenacl: ^0.6.0
  uuid: ^4.5.3
  wakelock_plus: ^1.2.10
  file_picker: ^11.0.2
  fido2: ^1.1.0
  flutter_nfc_kit: ^3.6.2
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  pdfrx: ^2.4.7
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  cryptography: ^2.9.0
  qr: ^4.0.0
  mobile_scanner: ^7.4.2
  package_info_plus: ^9.0.1
  sentry: ^9.30.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  wakelock_plus_platform_interface: ^1.5.1
  flutter_launcher_icons: ^0.14.4
  webview_flutter_platform_interface: ^2.15.1

# The Android adaptive icon is hand-written vector XML
# (res/drawable/ic_launcher_foreground.xml); the PNGs come from
# tools/render_launcher_icon.py. Re-running flutter_launcher_icons would
# replace the vectors with inset PNGs, so prefer the script.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#2D353B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"

flutter:
  uses-material-design: true
  assets:
    - third_party/licenses/
    - third_party/notices/
    # Host companion (companion.tar.gz + manifest.json), uploaded by the
    # Agent hooks screen. One archive, never loose scripts: App Store
    # Connect rejects any #! file in an iOS app as unsigned code. Refresh
    # with tools/bundle-companion.sh whenever host/ changes.
    - assets/companion/
    # Licence texts of the bundled fonts, shown in the app's licence page.
    - assets/fonts/LICENSE-JetBrainsMonoNerdFont.txt
    - assets/fonts/README-JetBrainsMonoNerdFont.md
    - assets/fonts/LICENSE-AtkynsonMono.txt
  fonts:
    # Omarchy's default monospace font (Nerd Fonts v3.5.1, "Mono" variant so
    # icons keep one terminal cell), unmodified. SIL OFL 1.1.
    - family: JetBrainsMonoNerdFontMono
      fonts:
        - asset: assets/fonts/JetBrainsMonoNerdFontMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMonoNerdFontMono-Bold.ttf
          weight: 700
    - family: AtkynsonMonoNerdFontMono
      fonts:
        - asset: assets/fonts/AtkynsonMonoNerdFontMono-Regular.otf
